services:
  api:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: urlshortner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      REDIS_HOST: cache
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortner
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql

  cache:
    image: redis:7

volumes:
  postgres_data:
